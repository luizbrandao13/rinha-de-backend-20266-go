worker_processes 1;

events {
    worker_connections 4096;
}

http {
    upstream backend {
        server api1:8080;
        server api2:8080;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
