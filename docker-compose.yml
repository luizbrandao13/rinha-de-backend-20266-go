x-api: &api
  image: ghcr.io/luizbrandao13/rinha-de-backend-20266-go:latest
  platform: linux/amd64
  pull_policy: always
  environment:
    PORT: "8080"
    LISTEN_ADDR: ":8080"
    GOMAXPROCS: "1"
    GOGC: "50"
    GOMEMLIMIT: "135MiB"
  expose:
    - "8080"
  deploy:
    resources:
      limits:
        cpus: "0.475"
        memory: 148M

services:
  lb:
    image: nginx:1.27-alpine
    platform: linux/amd64
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M

  api1:
    <<: *api

  api2:
    <<: *api
